[build]
  command = "npm run build"
  publish = "dist"

# `netlify dev` detecta Vite solo. No agregar `command`/`targetPort` en [dev]:
# eso desactiva la detección y la regla SPA de abajo termina reescribiendo los
# módulos de Vite (/src/*.tsx) a index.html.

# SPA: cualquier ruta del frontend (/boards/3, etc.) sirve index.html.
# Las funciones con `config.path` (/api/*) tienen prioridad sobre esta regla.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
